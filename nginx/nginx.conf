worker_processes  1;
error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log     logs/access.log;
    sendfile        on;
    keepalive_timeout  65;

    # --- Step 1 concept: this "upstream" block is the load-balancer pool.
    # NGINX will round-robin requests across these two Java instances.
    upstream java_backend {
        server 127.0.0.1:9091;
        server 127.0.0.1:9092;
    }

    server {
        listen       9090;
        server_name  localhost;

        # --- Step 2 concept: reverse proxy. Every request to NGINX on 9090
        # gets forwarded to one of the servers in java_backend above.
        location / {
            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
